<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Heber Yesid — Backend Developer. Futuristic system dashboard header. Available for work, Colombia, Systems Engineering student at UDES.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="55%" stop-color="#0A0E27"/>
      <stop offset="100%" stop-color="#0B1230"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0.15" cy="0.2" r="0.7">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowOrange" cx="0.92" cy="0.95" r="0.6">
      <stop offset="0%" stop-color="#FF7A00" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#FF7A00" stop-opacity="0"/>
    </radialGradient>
    <filter id="titleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00E5FF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1000" height="320" fill="url(#bg)"/>
  <rect width="1000" height="320" fill="url(#grid)"/>
  <rect width="1000" height="320" fill="url(#glowCyan)"/>
  <rect width="1000" height="320" fill="url(#glowOrange)"/>

  <g font-family="'Consolas','DejaVu Sans Mono',monospace">
    <rect x="0" y="150" width="1000" height="2" fill="#00E5FF" opacity="0.15"/>

    <path d="M 0 40 V 0 H 40" fill="none" stroke="#00E5FF" stroke-width="3"/>
    <path d="M 960 0 H 1000 V 40" fill="none" stroke="#39FF14" stroke-width="3"/>
    <path d="M 0 280 V 320 H 40" fill="none" stroke="#FF7A00" stroke-width="3"/>
    <path d="M 960 320 H 1000 V 280" fill="none" stroke="#00E5FF" stroke-width="3"/>

    <text x="30" y="31" font-size="13" fill="#00E5FF" opacity="0.8">[ SYS.INIT ] HeberYesid.profile</text>

    <circle cx="700" cy="27" r="4" fill="#39FF14"/>
    <text x="712" y="31" font-size="12" fill="#39FF14">ONLINE</text>
    <circle cx="784" cy="27" r="4" fill="#00E5FF"/>
    <text x="796" y="31" font-size="12" fill="#00E5FF">BACKEND</text>
    <circle cx="884" cy="27" r="4" fill="#FF7A00"/>
    <text x="896" y="31" font-size="12" fill="#FF7A00">OPEN TO WORK</text>

    <text x="40" y="120" font-size="15" fill="#39FF14">&gt;_ INITIALIZING BACKEND SYSTEMS</text>
    <text x="38" y="180" font-size="58" font-weight="bold" fill="#FFFFFF" filter="url(#titleGlow)">HEBER YESID</text>
    <text x="42" y="216" font-size="24" fill="#00E5FF">Backend Developer</text>
    <text x="42" y="252" font-size="17" fill="#D9E2FF">Building reliable backends for ambitious ideas.</text>
    <rect x="516" y="232" width="10" height="21" fill="#39FF14"/>

    <rect x="620" y="100" width="340" height="170" fill="#050816" fill-opacity="0.85" stroke="#00E5FF" stroke-opacity="0.6" rx="6"/>
    <circle cx="640" cy="122" r="5" fill="#FF7A00"/>
    <circle cx="660" cy="122" r="5" fill="#39FF14"/>
    <circle cx="680" cy="122" r="5" fill="#00E5FF"/>
    <text x="700" y="126" font-size="11" fill="#7FA8C9">terminal — backend.core</text>
    <line x1="620" y1="140" x2="960" y2="140" stroke="#00E5FF" stroke-opacity="0.25"/>
    <text x="640" y="166" font-size="13" fill="#39FF14">$ heber.init --role backend</text>
    <text x="640" y="190" font-size="13" fill="#7FA8C9">  stack: <tspan fill="#00E5FF">[java, python, typescript]</tspan></text>
    <text x="640" y="214" font-size="13" fill="#7FA8C9">  apis: <tspan fill="#00E5FF">[spring-boot, fastapi, nestjs]</tspan></text>
    <text x="640" y="238" font-size="13" fill="#7FA8C9">  status: <tspan fill="#39FF14">[online]</tspan> · open to work</text>
    <text x="640" y="258" font-size="13" fill="#39FF14">$</text>
    <rect x="656" y="247" width="9" height="15" fill="#39FF14"/>

    <line x1="30" y1="292" x2="970" y2="292" stroke="#FF7A00" stroke-opacity="0.5"/>
    <text x="40" y="310" font-size="13" fill="#FF7A00">STATUS: AVAILABLE FOR WORK ▸ COLOMBIA (UTC−5) ▸ UDES · SYSTEMS ENGINEERING · 8TH SEMESTER</text>

    <rect x="940" y="299" width="10" height="10" fill="#00E5FF" opacity="0.8"/>
    <rect x="956" y="299" width="10" height="10" fill="#39FF14" opacity="0.8"/>
    <rect x="972" y="299" width="10" height="10" fill="#FF7A00" opacity="0.8"/>
  </g>
</svg>
