<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" width="800" height="160" role="img" aria-label="Contribution activity preview. Regenerated weekly by GitHub Actions.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="100%" stop-color="#0A0E27"/>
    </linearGradient>
    <pattern id="cells" width="18" height="14" patternUnits="userSpaceOnUse">
      <rect x="2" y="2" width="10" height="8" rx="2" fill="#0B1230" stroke="#15385A" stroke-width="0.6"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="160" fill="url(#bg)"/>
  <g font-family="'Consolas','DejaVu Sans Mono',monospace">
    <text x="24" y="24" font-size="12" fill="#00E5FF" letter-spacing="1">CONTRIBUTION_GRID // ACTION-READY</text>
    <rect x="22" y="36" width="756" height="88" rx="5" fill="url(#cells)"/>

    <path id="snake-path" d="M 38 102 H 128 V 74 H 218 V 102 H 308 V 60 H 398 V 88 H 488 V 60 H 578 V 102 H 668 V 74 H 758" fill="none" stroke="#00E5FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" opacity="0.9"/>
    <circle r="6" fill="#39FF14" filter="url(#glow)">
      <animateMotion dur="7s" repeatCount="indefinite" rotate="auto">
        <mpath href="#snake-path"/>
      </animateMotion>
    </circle>

    <rect x="92" y="48" width="10" height="8" rx="2" fill="#00E5FF"/>
    <rect x="182" y="90" width="10" height="8" rx="2" fill="#39FF14"/>
    <rect x="362" y="48" width="10" height="8" rx="2" fill="#FF7A00"/>
    <rect x="542" y="90" width="10" height="8" rx="2" fill="#39FF14"/>
    <rect x="722" y="48" width="10" height="8" rx="2" fill="#FF7A00"/>

    <text x="24" y="146" font-size="11" fill="#7FA8C9">Live contribution animation is generated by .github/workflows/snake.yml</text>
  </g>
</svg>
