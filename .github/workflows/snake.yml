name: generate-snake

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - assets/snake.svg
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: HeberYesid
          outputs: |
            assets/snake.svg?color_snake=%2300E5FF&color_dots=%23050816,%230B1230,%2300E5FF,%2339FF14,%23FF7A00

      - name: Commit snake
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: regenerate contribution snake"
          file_pattern: assets/snake.svg
